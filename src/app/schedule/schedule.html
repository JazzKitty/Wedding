<p-timeline [value]="events" align="alternate" class="w-full  ">
    <ng-template #opposite let-event>
        <div style="align-self: center; padding: 10px;" class="text-sm text-surface-500 dark:text-surface-400">{{ event.time }}</div>
    </ng-template>
    <ng-template #marker let-event>
        <span style="background-color: var(--copper-skillet); border-radius: 50%; aspect-ratio: 1/1; width: 40px; display: flex; justify-content: center; align-items: center;" >
            <!-- <fa-icon [icon]="event.icon"></fa-icon> -->
            <img src="weddingbands.png" class="fa-md" style=" height: 100%; filter: brightness(0) invert(1);">
        </span>
    </ng-template>
    <ng-template #content let-event>
        <div style="width: 100%;">
            <div>
                test
            </div>

                test
            </div>

                test
            </div>
                        <div>

            </div>

                test
            </div>
        </div>
    </ng-template>
</p-timeline>
