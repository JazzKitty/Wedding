<div style="height: 100%; display: flex; flex-direction: column; padding-bottom: 20px">
  <h1 class="subtitle">Schedule</h1>
  <div style="display: flex; justify-content: space-between; align-items: center; flex-direction: column; flex-grow: 1">
    @for (event of events; track $index) {
      <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
        <h2
          style="margin: 5px"
          [ngStyle]="{ order: $index % 2 === 0 ? 3 : 1 }"
          [ngClass]="$index % 2 === 0 ? 'text-start' : 'text-end'">
          {{ event.time }}
        </h2>
        <span
          style="
            background-color: var(--copper-skillet);
            border-radius: 50%;
            aspect-ratio: 1/1;
            width: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            order: 2;
          ">
          @if (event.img) {
            <img
              alt=""
              [src]="event.img"
              class="fa-md"
              style="max-height: 100%; max-width: 100%; filter: brightness(0) invert(1)" />
          } @else {
            <fa-icon [icon]="event.icon"></fa-icon>
          }
        </span>
        <div
          class="card"
          style="white-space: nowrap; padding-right: 20px; padding-left: 20px; min-width: unset; width: unset;"
          [ngClass]="$index % 2 === 0 ? 'even-card' : 'odd-card'">
          <h2 style="white-space: wrap;">{{ event.text }}</h2>
        </div>
      </div>
    }
  </div>
</div>
