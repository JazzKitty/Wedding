<div class="subcontainer" style="display: flex; height: 100vh; flex-direction: column">
  <h1 class="subtitle">Photos</h1>
  <div
    style="
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 20px;
      overflow-y: auto;
      flex-grow: 1;
    ">
    @for (file of fileList; track $index) {
      <img
        [src]="'https://lh3.googleusercontent.com/d/' + file.id"
        alt="Google Drive Image Demo"
        style="height: 80vh; aspect-ratio: 1/1; object-fit: cover; max-width: 80vw;" />
    }
  </div>
</div>
